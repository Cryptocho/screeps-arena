# M2/S3+S4：单 app 服务容器 + 两卷（拓扑拍板见 plan-M2 §2 S3——无独立 screeps 服务定义：
# ScreepsService 仅 managed 模式，跨容器拆分归 M3+ 评估）。
# 卷只挂可变数据：server/db（世界库，镜像内已播种首启拷入）+ journal（对局恢复）。
services:
  app:
    build: .
    image: screeps-arena:latest
    ports:
      - '8787:8787'
    environment:
      # 在位时挂真实 LLM 唤醒；缺席 = 只推进时钟的观战形态
      - OPENROUTER_API_KEY
    volumes:
      - screeps-data:/app/.arena-data/server/db
      - arena-data:/app/.arena-data/journal

volumes:
  screeps-data:
  arena-data:
